name: Build Windows portable app
on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:session:win
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: npm run package:win
      - name: Archive portable app
        shell: pwsh
        run: Compress-Archive -Path dist/KIK-Trophy-win32-x64 -DestinationPath KIK-Trophy-v1.3.1-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KIK-Trophy-v1.3.1-Windows-x64
          path: KIK-Trophy-v1.3.1-Windows-x64.zip
